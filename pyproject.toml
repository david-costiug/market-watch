[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-watch"
version = "0.1.0"
description = "Exchange rate scraper and tracker"
requires-python = ">=3.9"
dependencies = [
    "selenium",
    "psycopg2-binary",
    "python-dotenv",
    "tzdata",
]

[project.scripts]
query-rates = "scripts.query_rates:main"
run-pipeline = "scripts.run_pipeline:run_all"
init-db = "app.database.init_database:init_db"
set-own-rate = "scripts.set_own_rate:main"
recommend = "scripts.recommend:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

